name: Publish images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: chmod +x gradlew && ./gradlew build -x test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./MCPClient
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/barbershop-mcp-client:latest
            ghcr.io/${{ github.repository_owner }}/barbershop-mcp-client:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./MCPServer

          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/barbershop-mcp-server:latest
            ghcr.io/${{ github.repository_owner }}/barbershop-mcp-server:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/barbershop-ai-consultant
            git pull
            docker compose pull
            docker compose up -d