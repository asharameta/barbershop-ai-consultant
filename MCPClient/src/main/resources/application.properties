server.port=8080
spring.ai.mcp.client.name=barbershop-mcp-client
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.mcp.client.sse.connections.barber-mcp-server.url=http://localhost:8081
spring.ai.openai.chat.enabled=false

asharameta.barbershop.knowledge-base.resource-pattern=classpath:/docs/**/*

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.root=INFO

ratelimit.capacity=20
ratelimit-refill-per-minute=5
barbershop.api-key=${BARBERSHOP_API_KEY}
chatmemory.max-conversations=20

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

idempotency.lock-ttl-seconds=120
idempotency.result-ttl-minutes=10
idempotency.max-body-bytes=16384