apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1               # if the pod dies, k8s restarts it
  selector:
    matchLabels: { app: redis }
  template:                 # the pod: this is the old "service" block
    metadata:
      labels: { app: redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: barbershop-secret, key: REDIS_PASSWORD }
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: { name: barbershop-secret, key: REDIS_PASSWORD }
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
          volumeMounts:
            - { name: data, mountPath: /data }
          livenessProbe:
            exec: { command: [ "redis-cli", "ping" ] }
            periodSeconds: 10
          readinessProbe:
            exec: { command: [ "redis-cli", "ping" ] }
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service               # gives it a stable DNS name: "redis"
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - port: 6379